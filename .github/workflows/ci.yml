name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_USER: wiki
          POSTGRES_PASSWORD: wiki
          POSTGRES_DB: wiki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wiki" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.12@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wiki/shared build
      - name: Lint
        run: pnpm lint
      - name: Typen prüfen
        run: pnpm typecheck
      - name: Unit- und Integrationstests (API)
        run: pnpm --filter @wiki/api test
      - name: Build
        run: pnpm build
      - name: Playwright-Browser installieren
        run: pnpm --filter @wiki/e2e exec playwright install --with-deps chromium
      - name: Ende-zu-Ende-Tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # S14: Abhängigkeiten mit bekannten kritischen Lücken brechen den Build ab
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level critical

  # S13: keine Geheimnisse im Repository
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose .

  # S14: Container-Images auf kritische Lücken prüfen
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
            context: .
          - app: web
            dockerfile: apps/web/Dockerfile
            context: .
          - app: drawio
            dockerfile: deploy/drawio/Dockerfile
            context: deploy/drawio
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -f ${{ matrix.dockerfile }} -t wikifordummys-${{ matrix.app }}:ci ${{ matrix.context }}
      - name: Trivy-Scan
        # Trivy als festes Image statt als Action, damit keine fremden Action-Tags ausgeführt werden
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy:0.65.0 \
            image --severity CRITICAL --ignore-unfixed --ignorefile /.trivyignore --exit-code 1 --no-progress wikifordummys-${{ matrix.app }}:ci

  # M4: Installer ohne Rückfragen auf einem frischen Ubuntu, danach Sicherung, Test-Wiederherstellung,
  # in der Betriebsart proxy ein Umzug (export, Neuinstallation, import) und in der Betriebsart internal
  # ein OWASP-ZAP-Baseline-Scan gegen die laufende Instanz.
  # In der Betriebsart internal laufen zusätzlich der Office-Editor (echtes Euro-Office-Image) und draw.io.
  install:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: internal
            office: j
            drawio: j
          - mode: proxy
            office: n
            drawio: n
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -x install.sh deploy/wikictl deploy/lib.sh
      - name: Installation (ohne Rückfragen)
        run: |
          sudo WIKI_TLS=${{ matrix.mode }} WIKI_DOMAIN=wiki.localtest PROXY_SAME_HOST=j \
            SMTP_ENABLE=n ADMIN_CREATE=j ADMIN_EMAIL=admin@example.com ADMIN_NAME=CI OFFICE_ENABLE=${{ matrix.office }} DRAWIO_ENABLE=${{ matrix.drawio }} \
            BACKUP_ENABLE=j BACKUP_KIND=local BACKUP_REPOSITORY=/var/backups/wiki-restic \
            INSTALL_UNATTENDED=n INSTALL_UFW=n INSTALL_FAIL2BAN=n \
            ./install.sh --non-interactive | tee install.txt
          # Der Installer prüft draw.io bis durch Caddy und meldet das Ergebnis
          if [ "${{ matrix.drawio }}" = j ]; then grep -q "draw.io läuft." install.txt; else grep -q "draw.io ist abgeschaltet" install.txt; fi
      - name: Erneuter Aufruf behält Schlüssel
        run: |
          before=$(sudo grep ENCRYPTION_KEY .env)
          sudo WIKI_TLS=${{ matrix.mode }} WIKI_DOMAIN=wiki.localtest PROXY_SAME_HOST=j SMTP_ENABLE=n ADMIN_CREATE=n \
            BACKUP_ENABLE=j BACKUP_KIND=local BACKUP_REPOSITORY=/var/backups/wiki-restic \
            ./install.sh --non-interactive --config-only
          test "$before" = "$(sudo grep ENCRYPTION_KEY .env)"
      - name: Status, Sicherung, Test-Wiederherstellung, Wiederherstellung
        run: |
          sudo wikictl status
          # IPv6 im Docker-Netz: Der Installer entscheidet selbst und schreibt das Ergebnis in .env (SEC-013)
          sudo grep -Eq "^WIKI_IPV6='(true|false)'" .env
          sudo wikictl backup
          sudo wikictl restore-test
          sudo wikictl restore latest --yes
          sudo wikictl monitor
      - name: Erreichbarkeit über Caddy
        run: |
          if [ "${{ matrix.mode }}" = proxy ]; then
            curl -fsS -H 'Host: wiki.localtest' -H 'X-Forwarded-Proto: https' http://127.0.0.1:8080/api/v1/health
          else
            curl -fsS -k --resolve wiki.localtest:443:127.0.0.1 https://wiki.localtest/api/v1/health
          fi
      - name: Office-Editor über Caddy und im internen Netz
        if: matrix.office == 'j'
        run: |
          base=https://wiki.localtest
          opts=(-k --resolve wiki.localtest:443:127.0.0.1)
          sudo wikictl status | tee status.txt
          grep -q "Office-Editor bereit" status.txt
          # Echter Durchlauf: Editor-Server holt eine Datei bei der API, wandelt sie um, die API holt das Ergebnis ab
          sudo wikictl office-check
          # Editor-Skript über Caddy, einbettbar nur im eigenen Wiki
          curl -fsS "${opts[@]}" -o api.js -D headers.txt "$base/office/web-apps/apps/api/documents/api.js"
          grep -q DocsAPI api.js
          grep -qi '^x-frame-options: SAMEORIGIN' headers.txt
          curl -fsS "${opts[@]}" "$base/office/healthcheck" | grep -q true
          # Von außen gesperrt: interne Pfade des Editor-Servers und die Rückruf-Adressen der API
          for path in /office/example/ /office/info/info.json /api/v1/office/callback /api/v1/office/files/x; do
            code=$(curl -s "${opts[@]}" -o /dev/null -w '%{http_code}' "$base$path")
            echo "$path → $code"
            test "$code" = 404
          done
      - name: draw.io über Caddy, abgeschottet
        if: matrix.drawio == 'j'
        run: |
          base=https://wiki.localtest
          opts=(-k --resolve wiki.localtest:443:127.0.0.1)
          sudo wikictl status | tee status.txt
          grep -q "draw.io bereit" status.txt
          curl -fsS "${opts[@]}" -o index.html -D headers.txt "$base/draw/index.html?embed=1&proto=json"
          grep -q 'js/bootstrap.js' index.html
          # Eigener, leerer Ursprung im Rahmen (kein Zugriff auf Cookies und API), nur im eigenen Wiki einbettbar
          grep -qi '^content-security-policy: sandbox allow-scripts' headers.txt
          grep -qi "frame-ancestors 'self'" headers.txt
          grep -qi '^x-frame-options: SAMEORIGIN' headers.txt
          # Adressen zeigen auf den eigenen Server, nicht auf app.diagrams.net
          curl -fsS "${opts[@]}" "$base/draw/js/PreConfig.js" | grep -q "location.host + '/draw'"
          curl -fsS "${opts[@]}" -o /dev/null "$base/draw/js/app.min.js"
          code=$(curl -s "${opts[@]}" -o /dev/null -w '%{http_code}' -X POST "$base/draw/index.html")
          test "$code" = 405
          # Die API kennt den Schalter
          sudo docker compose exec -T api printenv DRAWIO_ENABLED | grep -q true

      - name: Bestehende Installation ohne Editor-Einstellung, Update, Editor nachträglich einschalten
        if: matrix.office == 'n'
        run: |
          test -z "$(sudo docker compose --profile office ps -q office)"
          # Stand vor dem Office-Editor nachstellen: .env ohne WIKI_OFFICE und OFFICE_JWT_SECRET
          sudo sed -i '/^WIKI_OFFICE=/d; /^OFFICE_JWT_SECRET=/d' .env
          sudo wikictl update-apply </dev/null
          sudo grep -q "^WIKI_OFFICE='false'" .env
          test -z "$(sudo docker compose --profile office ps -q office)"
          sudo wikictl office on
          sudo wikictl status | grep -q "Office-Editor bereit"
          sudo wikictl office off
          test -z "$(sudo docker compose --profile office ps -q office)"
          # draw.io: ohne Einstellung bietet das Update es an und schaltet es ohne Rückfrage ein; danach wieder aus
          test -z "$(sudo docker compose --profile drawio ps -q drawio)"
          sudo sed -i '/^WIKI_DRAWIO=/d' .env
          sudo wikictl update-apply </dev/null | tee update.txt
          grep -q "draw.io läuft." update.txt
          sudo grep -q "^WIKI_DRAWIO='true'" .env
          sudo wikictl status | grep -q "draw.io bereit"
          curl -fsS -H 'Host: wiki.localtest' -H 'X-Forwarded-Proto: https' -o /dev/null http://127.0.0.1:8080/draw/index.html
          sudo wikictl drawio off
          test -z "$(sudo docker compose --profile drawio ps -q drawio)"
          # Aufräumen lässt laufende Dienste und Volumes in Ruhe
          sudo wikictl cleanup
          sudo wikictl monitor
      # Umzug auf einen "neuen Server": Export mit Testinhalt und Anhang, Volumes und .env löschen, frisch installieren
      # unter neuer Domain, Import, dann Inhalt, Anhänge und Schlüssel mit dem alten Stand vergleichen (docs/umzug.md)
      - name: Umzug mit wikictl export und import
        if: matrix.mode == 'proxy'
        run: |
          # Passwort über eine Datei, nur für root lesbar (nicht in der Kommandozeile)
          sudo sh -c "umask 077; echo ci-umzug-passwort-0123456789 >/root/umzug.pass; echo falsches-passwort-0123456789 >/root/falsch.pass"
          key=$(cat /proc/sys/kernel/random/uuid)
          printf 'Anhang für den Umzugstest\n' >anhang.txt
          sum=$(sha256sum anhang.txt | cut -d' ' -f1)
          sudo docker compose exec -T api sh -c "mkdir -p /var/lib/wiki/attachments/${key:0:2} && cat >/var/lib/wiki/attachments/${key:0:2}/$key" <anhang.txt
          sudo docker compose exec -T db psql -q -v ON_ERROR_STOP=1 -U wiki -d wiki <<SQL
          INSERT INTO spaces (id, key, name, updated_at) VALUES ('00000000-0000-4000-8000-000000000001', 'UMZUG', 'Umzug', now());
          INSERT INTO pages (id, space_id, path, position, title, content, content_text, updated_at)
            VALUES ('00000000-0000-4000-8000-000000000002', '00000000-0000-4000-8000-000000000001',
              '/00000000-0000-4000-8000-000000000002/', 0, 'Umzugstest', '{"type":"doc","content":[]}', 'Umzugstest', now());
          INSERT INTO attachments (id, page_id, filename, mime_type, size_bytes, storage_key, sha256)
            VALUES ('00000000-0000-4000-8000-000000000003', '00000000-0000-4000-8000-000000000002', 'anhang.txt', 'text/plain',
              $(stat -c %s anhang.txt), '$key', '$sum');
          SQL
          fingerprint() {
            sudo docker compose exec -T db psql -At -U wiki -d wiki -c "SELECT md5(string_agg(t, '|' ORDER BY t)) FROM (
              SELECT id || email || coalesce(password_hash, '') AS t FROM users UNION ALL SELECT id || key || name FROM spaces
              UNION ALL SELECT id || title || content::text FROM pages UNION ALL SELECT storage_key || sha256 FROM attachments) x"
            vol=$(sudo docker volume inspect -f '{{ .Mountpoint }}' wikifordummys_attachments)
            sudo sh -c "cd '$vol' && find . -type f -print0 | sort -z | xargs -0 sha256sum"
          }
          fingerprint >vorher.txt
          old_key=$(sudo grep '^ENCRYPTION_KEY=' .env)

          sudo wikictl export --output /var/tmp/umzug.wiki.gpg --passphrase-file /root/umzug.pass --stop
          test "$(sudo stat -c %a /var/tmp/umzug.wiki.gpg)" = 600
          # Verschlüsselt: weder Schlüssel noch Anhang im Klartext; mit --stop läuft auf dem alten Server nichts mehr
          if sudo grep -qF "$(echo "$old_key" | cut -d"'" -f2)" /var/tmp/umzug.wiki.gpg; then exit 1; fi
          if sudo grep -qF 'Anhang für den Umzugstest' /var/tmp/umzug.wiki.gpg; then exit 1; fi
          test -z "$(sudo docker compose ps -q --status running)"

          # Neuer Server: keine Volumes, keine .env, andere Domain, kein Administrator
          sudo docker compose --profile office --profile drawio down -v
          sudo rm -f .env .env.bak
          sudo WIKI_TLS=proxy WIKI_DOMAIN=neu.localtest PROXY_SAME_HOST=j SMTP_ENABLE=n ADMIN_CREATE=n OFFICE_ENABLE=n DRAWIO_ENABLE=n \
            BACKUP_ENABLE=j BACKUP_KIND=local BACKUP_REPOSITORY=/var/backups/wiki-restic-neu \
            INSTALL_UNATTENDED=n INSTALL_UFW=n INSTALL_FAIL2BAN=n ./install.sh --non-interactive
          test "$(sudo grep '^ENCRYPTION_KEY=' .env)" != "$old_key"

          # Falsches Passwort und veränderte Datei werden abgelehnt, ohne etwas zu ändern
          if sudo wikictl import /var/tmp/umzug.wiki.gpg --passphrase-file /root/falsch.pass --yes; then exit 1; fi
          sudo cp /var/tmp/umzug.wiki.gpg /var/tmp/kaputt.wiki.gpg
          printf 'x' | sudo dd of=/var/tmp/kaputt.wiki.gpg bs=1 seek=4000 conv=notrunc status=none
          if sudo wikictl import /var/tmp/kaputt.wiki.gpg --passphrase-file /root/umzug.pass --yes; then exit 1; fi
          # Unverschlüsselt verpackt (gpg --store) gibt gpg den Inhalt mit jedem Passwort aus; der Import muss ablehnen
          sudo sh -c 'gpg --batch --quiet --pinentry-mode loopback --passphrase-file /root/umzug.pass --decrypt /var/tmp/umzug.wiki.gpg |
            gpg --batch --yes --store -o /var/tmp/ohne.wiki.gpg'
          if sudo wikictl import /var/tmp/ohne.wiki.gpg --passphrase-file /root/falsch.pass --yes; then exit 1; fi
          sudo grep -q "^WIKI_DOMAIN='neu.localtest'" .env

          sudo wikictl import /var/tmp/umzug.wiki.gpg --passphrase-file /root/umzug.pass --yes 2>&1 | tee import.txt
          grep -q "Umzug abgeschlossen" import.txt
          grep -q "Neue Domain (wiki.localtest → neu.localtest)" import.txt
          # Gleicher Inhalt und gleiche Anhänge, Schlüssel vom alten Server, Domain und Sicherung vom neuen
          fingerprint >nachher.txt
          diff vorher.txt nachher.txt
          # Die Umzugsdatei trägt nur die übernommenen Einstellungen, keine Zugänge der alten Sicherung
          sudo sh -c 'gpg --batch --quiet --pinentry-mode loopback --passphrase-file /root/umzug.pass --decrypt /var/tmp/umzug.wiki.gpg |
            tar -xOf - staging/env' >umzug-env.txt
          grep -q '^ENCRYPTION_KEY=' umzug-env.txt
          if grep -Eq '^(BACKUP_|DB_PASSWORD|REDIS_PASSWORD|WIKI_DOMAIN)' umzug-env.txt; then exit 1; fi
          rm -f umzug-env.txt
          test "$(sudo grep '^ENCRYPTION_KEY=' .env)" = "$old_key"
          sudo grep -q "^WIKI_DOMAIN='neu.localtest'" .env
          sudo grep -q "^BACKUP_REPOSITORY='/var/backups/wiki-restic-neu'" .env
          curl -fsS -H 'Host: neu.localtest' -H 'X-Forwarded-Proto: https' http://127.0.0.1:8080/api/v1/health
          # Der Administrator vom alten Server ist da; Sicherung und Test-Wiederherstellung auf dem neuen Server
          sudo wikictl reset-password --email admin@example.com
          sudo wikictl backup
          sudo wikictl restore-test
          sudo wikictl monitor
      - name: OWASP ZAP Baseline-Scan
        if: matrix.mode == 'internal'
        run: |
          chmod 777 .zap
          docker run --rm --network host --add-host wiki.localtest:127.0.0.1 -v "$PWD/.zap:/zap/wrk:rw" \
            zaproxy/zap-stable:2.16.1 zap-baseline.py -t https://wiki.localtest -c rules.tsv -I \
            -r zap-report.html -J zap-report.json
      - uses: actions/upload-artifact@v4
        if: always() && matrix.mode == 'internal'
        with:
          name: zap-report
          path: .zap/zap-report.*
          retention-days: 14
          if-no-files-found: ignore
      - name: Logs bei Fehlern
        if: failure()
        run: |
          sudo docker compose --profile office --profile drawio logs --tail 200 || true
          id=$(sudo docker compose --profile office ps -q office 2>/dev/null || true)
          if [ -n "$id" ]; then sudo docker inspect -f '{{json .State.Health}}' "$id"; fi
