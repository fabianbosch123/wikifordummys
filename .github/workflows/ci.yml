name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wiki
          POSTGRES_PASSWORD: wiki
          POSTGRES_DB: wiki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wiki" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wiki/shared build
      - name: Lint
        run: pnpm lint
      - name: Typen prüfen
        run: pnpm typecheck
      - name: Unit- und Integrationstests (API)
        run: pnpm --filter @wiki/api test
      - name: Build
        run: pnpm build
      - name: Playwright-Browser installieren
        run: pnpm --filter @wiki/e2e exec playwright install --with-deps chromium
      - name: Ende-zu-Ende-Tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # S14: Abhängigkeiten mit bekannten kritischen Lücken brechen den Build ab
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level critical

  # S13: keine Geheimnisse im Repository
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose .

  # S14: Container-Images auf kritische Lücken prüfen
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -f apps/${{ matrix.app }}/Dockerfile -t wikifordummys-${{ matrix.app }}:ci .
      - name: Trivy-Scan
        # Trivy als festes Image statt als Action, damit keine fremden Action-Tags ausgeführt werden
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress wikifordummys-${{ matrix.app }}:ci
