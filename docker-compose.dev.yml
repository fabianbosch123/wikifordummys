# Nur für die Entwicklung: Datenbank, Redis und ein Mail-Testpostfach.
#   docker compose -f docker-compose.dev.yml up -d
# Ports sind nur auf localhost erreichbar.
name: wikifordummys-dev

services:
  db:
    image: postgres:16.15@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
    ports: ["127.0.0.1:5432:5432"]
    volumes: [devpg:/var/lib/postgresql/data]

  redis:
    image: redis:7.4.12@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
    ports: ["127.0.0.1:6379:6379"]

  # Weboberfläche unter http://localhost:8025 zeigt alle verschickten Mails
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

volumes:
  devpg: {}
