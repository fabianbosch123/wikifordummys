# Betrieb auf dem Server: docker compose up -d
# Konfiguration in .env (Vorlage: .env.example, Rechte 600)
name: wikifordummys

x-logging: &logging
  driver: json-file
  options: { max-size: 50m, max-file: "3" }

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WIKI_DOMAIN: ${WIKI_DOMAIN:?WIKI_DOMAIN fehlt in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    networks: [frontend]
    logging: *logging

  web:
    image: ghcr.io/fabianbosch123/wikifordummys-web:${WIKI_VERSION:-latest}
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    networks: [frontend]
    logging: *logging

  api:
    image: ghcr.io/fabianbosch123/wikifordummys-api:${WIKI_VERSION:-latest}
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${WIKI_DOMAIN}
      DATABASE_URL: postgresql://wiki:${DB_PASSWORD:?DB_PASSWORD fehlt in .env}@db:5432/wiki
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD fehlt in .env}@redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY fehlt in .env}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt in .env}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-wikifordummys <wiki@localhost>}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-50}
    volumes:
      - attachments:/var/lib/wiki/attachments
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # frontend für Caddy und ausgehende Mails, backend für Datenbank und Redis
    networks: [frontend, backend]
    logging: *logging

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    logging: *logging

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]
    logging: *logging

networks:
  frontend: {}
  # Kein Zugang nach außen: Datenbank und Redis sind nur für die API erreichbar
  backend: { internal: true }

volumes:
  caddy_data: {}
  caddy_config: {}
  pgdata: {}
  redisdata: {}
  attachments: {}
