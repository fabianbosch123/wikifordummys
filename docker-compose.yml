# Betrieb auf dem Server: am einfachsten über ./install.sh und danach wikictl
# Konfiguration in .env (erzeugt vom Installer, Vorlage: .env.example, Rechte 600)
name: wikifordummys

x-logging: &logging
  driver: json-file
  options: { max-size: 50m, max-file: "3" }

# Härtung (SEC-012): keine Rechteausweitung über setuid-Programme; wo möglich ohne Linux-Fähigkeiten
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

# Fremde Images mit fester Version und Digest; Renovate (docker:pinDigests) schlägt Updates als PR vor.
# wikictl update zieht sie vor dem Neustart (compose pull), sonst bliebe der Stand der Installation stehen.

services:
  caddy:
    image: caddy:2.11.7@sha256:5e5286cb37d44086d651a5363f05f43a692ce4d649d88fb1bd844579f45fa9e8
    restart: unless-stopped
    # Betriebsart aus .env: letsencrypt (öffentlich), internal (eigenes Netz) oder proxy (hinter vorhandenem Reverse Proxy)
    command: ["caddy", "run", "--config", "/etc/caddy/${WIKI_TLS:-letsencrypt}.Caddyfile", "--adapter", "caddyfile"]
    ports:
      # Im Proxy-Betrieb z. B. 127.0.0.1:8080 und 127.0.0.1:8443, damit sich nichts mit dem vorhandenen Proxy überschneidet
      - "${WIKI_HTTP_PORT:-80}:80"
      - "${WIKI_HTTPS_PORT:-443}:443"
      - "${WIKI_HTTPS_PORT:-443}:443/udp"
    environment:
      WIKI_DOMAIN: ${WIKI_DOMAIN:?WIKI_DOMAIN fehlt in .env}
      WIKI_TRUSTED_PROXIES: ${WIKI_TRUSTED_PROXIES:-private_ranges}
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-50}
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    # Läuft als root im Container, braucht aber nur das Binden an die Ports 80 und 443
    <<: *hardened
    cap_add: [NET_BIND_SERVICE]
    networks: [frontend, office, drawio]
    logging: *logging

  web:
    image: ghcr.io/fabianbosch123/wikifordummys-web:${WIKI_VERSION:-latest}
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    <<: *hardened
    networks: [frontend]
    logging: *logging

  api:
    image: ghcr.io/fabianbosch123/wikifordummys-api:${WIKI_VERSION:-latest}
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${WIKI_DOMAIN}
      DATABASE_URL: postgresql://wiki:${DB_PASSWORD:?DB_PASSWORD fehlt in .env}@db:5432/wiki
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD fehlt in .env}@redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY fehlt in .env}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt in .env}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-wikifordummys <wiki@localhost>}
      COOKIE_SECURE: "true"
      # Proxys vor der API: Caddy = 1, im Proxy-Betrieb zusätzlich der vorhandene Reverse Proxy = 2
      TRUST_PROXY: ${WIKI_TRUST_PROXY_HOPS:-1}
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-50}
      # Schutz vor voller Platte (SEC-003): freie Reserve, Upload-Menge je Benutzer und Tag, Uploads je Stunde
      ATTACHMENT_MIN_FREE_MB: ${ATTACHMENT_MIN_FREE_MB:-2048}
      ATTACHMENT_QUOTA_MB_PER_DAY: ${ATTACHMENT_QUOTA_MB_PER_DAY:-2048}
      RATE_UPLOADS_PER_HOUR: ${RATE_UPLOADS_PER_HOUR:-300}
      # Office-Editor (Dienst office, nur mit WIKI_OFFICE=true): gemeinsames Geheimnis für die signierten Nachrichten
      OFFICE_ENABLED: ${WIKI_OFFICE:-false}
      OFFICE_JWT_SECRET: ${OFFICE_JWT_SECRET:-}
      # Zeichnungen mit draw.io (Dienst drawio, nur mit WIKI_DRAWIO=true)
      DRAWIO_ENABLED: ${WIKI_DRAWIO:-false}
      # OAuth für claude.ai-Connectors: erlaubte Rücksprung-Hosts (docs/mcp.md)
      OAUTH_REDIRECT_HOSTS: ${OAUTH_REDIRECT_HOSTS:-claude.ai,claude.com}
    volumes:
      - attachments:/var/lib/wiki/attachments
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    <<: *hardened
    # frontend für Caddy und ausgehende Mails, backend für Datenbank und Redis, office für den Editor-Server
    networks: [frontend, backend, office]
    logging: *logging

  # Office-Editor Euro-Office (AGPL-3.0, Fork von ONLYOFFICE Docs) zum Ansehen und Bearbeiten von Office-Anhängen.
  # Optional: startet nur mit dem Profil office (WIKI_OFFICE=true in .env; install.sh und wikictl setzen dann das Profil).
  # Speichert keine Dokumente dauerhaft; die Dateien bleiben im Anhang-Volume der API.
  office:
    image: ghcr.io/euro-office/documentserver:${OFFICE_VERSION:-v9.3.6}
    profiles: [office]
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${OFFICE_JWT_SECRET:-}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      # Dateien kommen von der API im internen Docker-Netz (private Adresse); das Netz office hat keinen Weg nach draußen
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"
      WOPI_ENABLED: "false"
      EXAMPLE_ENABLED: "false"
      PLUGINS_ENABLED: "false"
      NGINX_CLIENT_MAX_BODY_SIZE: ${ATTACHMENT_MAX_MB:-50}m
      # Standard sind 60 s; startet RabbitMQ im Container langsamer (erster Start, volle oder langsame Platte),
      # läuft der Dokumentdienst ohne Warteschlange und der Editor antwortet bis zum Neustart mit HTTP 502
      AMQP_START_TIMEOUT: "300"
      # Schriftliste beim Start neu aufbauen, damit die freien Schriften aus fonts/ im Editor erscheinen
      GENERATE_FONTS: "true"
    volumes:
      - office_data:/var/www/euro-office/Data
      # Freie Ersatzschriften (SIL OFL bzw. Bitstream-Vera-Lizenz, siehe docs/schriftarten.md), nur lesend
      - ./fonts:/usr/share/fonts/truetype/custom:ro
    healthcheck:
      # Im Image gibt es kein curl; bash spricht HTTP direkt über /dev/tcp (mit Host-Kopfzeile für nginx)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80 && printf 'GET /healthcheck HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && timeout 5 cat <&3 | grep -q true"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    networks: [office]
    logging: *logging

  # draw.io (Apache-2.0) für Zeichnungen auf Seiten, z. B. Netzwerkpläne: nur statische Dateien unter /draw/,
  # die App läuft im Browser. Optional: Profil drawio (WIKI_DRAWIO=true in .env). Speichert nichts; Zeichnungen
  # sind Anhänge der Seiten. Wird beim Installieren und bei Updates aus deploy/drawio gebaut (etwa 150 MB).
  drawio:
    build: { context: deploy/drawio }
    profiles: [drawio]
    restart: unless-stopped
    # Ohne Root, nur lesend; das Caddy-Programm im Image trägt die Fähigkeit NET_BIND_SERVICE und startet ohne sie nicht
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/data:uid=65534,gid=65534", "/config:uid=65534,gid=65534"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/draw/index.html"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks: [drawio]
    logging: *logging

  db:
    image: postgres:16.15@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Der Start wechselt per gosu zum Benutzer postgres und braucht dafür Fähigkeiten; nur keine Rechteausweitung
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    logging: *logging

  redis:
    image: redis:7.4.12@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
    restart: unless-stopped
    # Passwort über eine Konfigurationsdatei statt als Argument, sonst steht es in ps und docker inspect (SEC-012).
    # docker-entrypoint.sh wechselt danach zum Benutzer redis, der die Datei lesen darf.
    entrypoint:
      - sh
      - -c
      - >-
        umask 077 && printf 'requirepass %s\n' "$$REDIS_PASSWORD" >/tmp/redis.conf && chown redis:redis /tmp/redis.conf &&
        exec docker-entrypoint.sh redis-server /tmp/redis.conf --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    logging: *logging

networks:
  # IPv6 im Docker-Netz (WIKI_IPV6=true, setzen install.sh und wikictl, wenn der Server IPv6 hat und Docker ab 27 läuft):
  # Dann sieht die API die echte IPv6-Adresse statt der Gateway-Adresse des Docker-Netzes, und Rate-Limits und
  # fail2ban treffen nur den Absender, nicht alle IPv6-Benutzer zugleich (SEC-013)
  frontend:
    enable_ipv6: ${WIKI_IPV6:-false}
  # Kein Zugang nach außen: Datenbank und Redis sind nur für die API erreichbar
  backend: { internal: true }
  # Editor-Server: erreichbar nur für Caddy und API, selbst ohne Zugang ins Internet
  office: { internal: true }
  # draw.io: nur für Caddy erreichbar, ohne Zugang ins Internet
  drawio: { internal: true }

volumes:
  caddy_data: {}
  caddy_config: {}
  pgdata: {}
  redisdata: {}
  attachments: {}
  office_data: {}
