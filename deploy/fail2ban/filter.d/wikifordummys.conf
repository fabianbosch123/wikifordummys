# fail2ban-Filter für wikifordummys: fehlgeschlagene Anmeldungen, 2FA-Versuche und falsche API-Tokens (MCP und Android-App) aus dem Log der API.
# Die API schreibt sie als JSON-Zeile ({"audit":"auth.login.failed","ip":"…"}); Docker legt jede Zeile
# nochmals als JSON in /var/lib/docker/containers/<id>/<id>-json.log ab, daher die maskierten Anführungszeichen.
[Definition]
failregex = \\"audit\\":\\"(?:auth\.(?:login|2fa|2fa\.setup)|mcp\.auth|app\.auth)\.failed\\",\\"ip\\":\\"(?:::ffff:)?<ADDR>\\"
ignoreregex =
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S
